<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise For You ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #f472b6; /* pink-400 */
            --bg-color: #020617; /* slate-950 */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: white;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Deep immersive animated background */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #020617 100%);
            z-index: -2;
        }

        /* Glowing orbs moving in background */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatOrb 20s infinite alternate ease-in-out;
            z-index: -1;
        }
        .orb-1 { width: 300px; height: 300px; background: #8b5cf6; top: -10%; left: -10%; }
        .orb-2 { width: 400px; height: 400px; background: #db2777; bottom: -10%; right: -10%; animation-delay: -5s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10vw, 10vh) scale(1.2); }
        }

        .cursive { font-family: 'Dancing Script', cursive; }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: scale(0.9);
            padding: 1.5rem;
            z-index: 10;
        }
        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 20;
        }

        .custom-input {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(244, 114, 182, 0.3);
            color: white;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            border-color: rgba(244, 114, 182, 1);
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.4), inset 0 2px 4px rgba(0,0,0,0.5);
            outline: none;
        }
        .custom-input::placeholder { color: #94a3b8; }

        .btn-glow {
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.6);
            transform: translateY(-2px);
        }

        /* The Runaway No Button */
        .btn-no-clone {
            position: fixed !important; /* Forces it relative to screen */
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 9999;
            box-shadow: 0 10px 15px -3px rgba(220, 38, 38, 0.5);
        }

        .balloon {
            position: absolute;
            width: 50px;
            height: 65px;
            background: radial-gradient(circle at 30% 30%, #f9a8d4, #db2777);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2);
            z-index: 5;
            transition: transform 0.1s;
        }
        .balloon::before {
            content: "▲";
            font-size: 14px;
            color: #db2777;
            position: absolute;
            bottom: -9px;
            left: 50%;
            transform: translateX(-50%);
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 25px;
            background: rgba(255,255,255,0.4);
        }
        .balloon:hover { transform: scale(1.1); }

        /* Floating message where balloon pops */
        .pop-message {
            position: fixed;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #fbcfe8;
            text-shadow: 0 0 10px #db2777, 0 0 20px #db2777;
            pointer-events: none;
            z-index: 1000;
            animation: floatUpFade 3s ease-out forwards;
            white-space: nowrap;
            transform: translate(-50%, -50%);
        }

        @keyframes floatUpFade {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            20% { transform: translate(-50%, -80%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -200%) scale(1); }
        }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Particle effect for balloon pop */
        .particle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: #f472b6;
            border-radius: 50%;
            pointer-events: none;
            animation: explode 0.6s cubic-bezier(0, 0, 0.2, 1) forwards;
            z-index: 999;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Footer -->
    <a href="https://doomsage.in" target="_blank" class="fixed bottom-3 left-1/2 -translate-x-1/2 text-xs text-white/40 hover:text-pink-400 transition-colors z-50 tracking-widest uppercase">
        Made by Doomsage
    </a>

    <div id="screen-1" class="screen active">
        <div class="glass-card p-8 md:p-10 rounded-[2rem] max-w-md w-full text-center">
            <h1 class="cursive text-5xl text-pink-400 mb-6 leading-tight drop-shadow-[0_0_8px_rgba(244,114,182,0.5)]">
            Which part of your body is my fav?
            </h1>
            <input type="text" id="ans-input" placeholder="Hint: Something beautiful..." class="custom-input w-full rounded-xl px-5 py-4 mb-3 text-center text-xl font-medium">
            <div id="error-msg" class="text-red-400 text-sm font-semibold h-6 mb-4 opacity-0 transition-opacity duration-300">Galat jawab!</div>
            
            <button onclick="checkAnswer()" class="btn-glow w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold py-4 rounded-xl text-lg tracking-wide">
                Check Answer ✨
            </button>
        </div>
    </div>

    <div id="screen-2" class="screen">
        <div class="glass-card p-10 rounded-[2rem] max-w-md w-full min-h-[350px] flex flex-col items-center justify-center text-center">
            <h1 class="cursive text-5xl text-pink-400 mb-10 drop-shadow-[0_0_8px_rgba(244,114,182,0.5)]">Do you love me?</h1>
            
            <div class="flex gap-6 w-full justify-center relative">
                <button onclick="nextScreen(3); startBalloonSpawning();" class="btn-glow bg-gradient-to-r from-emerald-400 to-teal-500 text-white font-bold py-3 px-10 rounded-full shadow-lg text-2xl z-20 hover:scale-105 transition-transform">
                    Yes! ❤️
                </button>
                
                <!-- This button will be grabbed by JS, un-anchored, and split -->
                <button id="btn-no-original" class="bg-gradient-to-r from-rose-500 to-red-600 text-white font-bold py-3 px-10 rounded-full text-2xl z-[9999]">
                    No 😒
                </button>
            </div>
        </div>
    </div>

    <div id="screen-3" class="screen">
        <div class="absolute top-10 left-0 w-full text-center z-50 pointer-events-none">
            <h1 class="cursive text-5xl text-pink-300 mb-2 drop-shadow-lg">Pop the balloons!</h1>
            <p class="text-gray-300 text-lg font-light bg-black/30 inline-block px-4 py-1 rounded-full backdrop-blur-sm">Catch them to reveal a secret...</p>
        </div>
        
        <!-- Balloon container -->
        <div id="balloon-area" class="absolute inset-0 overflow-hidden w-full h-full z-10"></div>

        <!-- Next button (hidden until enough balloons popped) -->
        <button id="btn-to-gallery" onclick="nextScreen(4)" class="fixed bottom-20 btn-glow bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold py-4 px-10 rounded-full shadow-[0_0_20px_rgba(219,39,119,0.5)] hidden opacity-0 transition-opacity duration-500 text-xl z-50">
            Show me more ➡️
        </button>
    </div>

    <div id="screen-4" class="screen overflow-y-auto">
        <div class="w-full max-w-md mx-auto pt-10 pb-24">
            <h1 class="cursive text-5xl text-center text-pink-400 mb-8 drop-shadow-lg">Our Memories 📸</h1>
            
            <div class="grid grid-cols-2 gap-3 mb-10">
                <!-- DOST KO BOLNA IMAGES KE LINKS YAHAN DALE -->
                <div class="aspect-square bg-white/5 rounded-2xl overflow-hidden border border-white/10 shadow-lg relative group">
                    <img src="https://via.placeholder.com/400x400/2a2a4a/f472b6?text=Photo+1" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                </div>
                <div class="aspect-square bg-white/5 rounded-2xl overflow-hidden border border-white/10 shadow-lg relative group">
                    <img src="https://i.ibb.co/VpJ1GqdJ/IMG-20260913-235146.jpg" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                </div>
                <div class="aspect-[4/3] col-span-2 bg-white/5 rounded-2xl overflow-hidden border border-white/10 shadow-lg relative group">
                    <img src="https://i.ibb.co/DH5JBZ32/IMG-20260913-234930.jpg" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                </div>
                <div class="aspect-square bg-white/5 rounded-2xl overflow-hidden border border-white/10 shadow-lg relative group">
                    <img src="https://i.ibb.co/5W7wmGFm/IMG-20260913-235235.jpg" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                </div>
                <div class="aspect-square bg-white/5 rounded-2xl overflow-hidden border border-white/10 shadow-lg relative group">
                    <img src="https://i.ibb.co/d0fRGTxR/IMG-20260913-235107.jpg" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                </div>
            </div>

            <button onclick="nextScreen(5)" class="btn-glow w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold py-4 rounded-xl shadow-lg text-lg">
                One Last Thing...
            </button>
        </div>
    </div>

    <div id="screen-5" class="screen">
        <div class="glass-card p-8 rounded-[2rem] max-w-md w-full text-center">
            <h1 class="cursive text-4xl text-pink-400 mb-2 drop-shadow-md">Did you like it?</h1>
            <p class="text-gray-300 mb-6 font-light">Write a little something for me...</p>
            
            <form id="secret-form" class="flex flex-col gap-4">
                <!-- IMPORTANT: DOST KI WEB3FORMS ACCESS KEY YAHAN AAYEGI -->
                <input type="hidden" name="access_key" value="3d5c4cd6-221c-4fd2-b10c-0749efd8b728">
                <input type="hidden" name="subject" value="New Birthday Message from Website! ❤️">
                
                <textarea name="message" rows="4" placeholder="Your cute message here..." class="custom-input w-full rounded-xl px-4 py-3 resize-none text-lg" required></textarea>
                
                <button type="submit" id="submit-btn" class="btn-glow w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold py-4 rounded-xl flex justify-center items-center gap-2 text-lg">
                    <span>Send Message ❤️</span>
                    <!-- Loader SVG -->
                    <svg id="submit-loader" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
                <p id="form-status" class="text-sm font-semibold h-5 mt-1 transition-colors"></p>
            </form>
        </div>
    </div>

    <script>
        // --- SCREEN NAVIGATION ---
        function nextScreen(num) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${num}`).classList.add('active');
        }

        // --- TASK 1: CHECK ANSWER ---
        function checkAnswer() {
            const input = document.getElementById('ans-input');
            const errorMsg = document.getElementById('error-msg');
            const val = input.value.trim().toLowerCase();
            
            // DOST KO BOLNA APNE HISAB SE ANSWERS SET KARE
            const correctAnswers = ["smile", "neck", "everything"]; 

            if (val === "") {
                errorMsg.innerText = "Kuch toh likho na!";
                errorMsg.style.opacity = '1';
                input.classList.add('shake');
                setTimeout(() => input.classList.remove('shake'), 400);
            } else if (correctAnswers.includes(val)) {
                errorMsg.style.opacity = '0';
                nextScreen(2);
                initRunawayButton(); // Start game logic for screen 2
            } else {
                errorMsg.innerText = "Nahi! Socho aur try karo 😉";
                errorMsg.style.opacity = '1';
                input.classList.add('shake');
                setTimeout(() => input.classList.remove('shake'), 400);
            }
        }

        // --- TASK 2: THE SPLITTING RUNAWAY "NO" BUTTON ---
        let noButtonCount = 1;

        function initRunawayButton() {
            const originalBtn = document.getElementById('btn-no-original');
            // Extract coordinates to transition smoothly to absolute positioning
            const rect = originalBtn.getBoundingClientRect();
            
            originalBtn.style.left = `${rect.left}px`;
            originalBtn.style.top = `${rect.top}px`;
            originalBtn.style.width = `${rect.width}px`;
            originalBtn.style.height = `${rect.height}px`;
            originalBtn.classList.add('btn-no-clone');
            
            attachRunawayEvents(originalBtn);
        }

        function attachRunawayEvents(btn) {
            // Support both desktop hover and mobile touch
            btn.addEventListener('mouseover', (e) => handleRunaway(e, btn));
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Stop click bleeding
                handleRunaway(e, btn);
            });
        }

        function handleRunaway(event, btn) {
            // 1. Move to random position on ENTIRE screen safely inside bounds
            const maxX = window.innerWidth - btn.offsetWidth - 20;
            const maxY = window.innerHeight - btn.offsetHeight - 20;
            const newX = Math.max(10, Math.floor(Math.random() * maxX));
            const newY = Math.max(10, Math.floor(Math.random() * maxY));
            
            btn.style.left = `${newX}px`;
            btn.style.top = `${newY}px`;

            // 2. Shrink slightly on every interaction
            let currentScale = parseFloat(btn.getAttribute('data-scale') || 1);
            if (currentScale > 0.4) {
                currentScale -= 0.15;
                btn.style.transform = `scale(${currentScale})`;
                btn.setAttribute('data-scale', currentScale);
            }

            // 3. SPLIT (Clone) into 2 parts! (Max 15 buttons to prevent lag)
            if(noButtonCount < 15) {
                const clone = btn.cloneNode(true);
                // Ensure clone acts independently
                clone.style.left = `${Math.max(10, Math.floor(Math.random() * maxX))}px`;
                clone.style.top = `${Math.max(10, Math.floor(Math.random() * maxY))}px`;
                
                document.body.appendChild(clone);
                attachRunawayEvents(clone);
                noButtonCount++;
            }
        }

        // --- TASK 3: ENDLESS BALLOONS & COORDINATE-BASED MESSAGES ---
        const balloonArea = document.getElementById('balloon-area');
        const nextBtnBalloons = document.getElementById('btn-to-gallery');
        let totalPopped = 0;
        let balloonInterval;

        // Custom messages to pop out
        const secretMessages = [
            "I love your smile!", "You're my everything ❤️", "Mine forever!",
            "You look gorgeous today", "Missing you!", "Best girlfriend ever",
            "I'm so lucky!", "Cutie pie 🥰", "Love you infinity!"
        ];

        function startBalloonSpawning() {
            // Clean up any remaining No buttons
            document.querySelectorAll('.btn-no-clone').forEach(el => el.remove());

            // Spawn a balloon every 600ms
            balloonInterval = setInterval(createBalloon, 600);
        }

        function createBalloon() {
            const b = document.createElement('div');
            b.className = 'balloon';
            
            // Random start position at bottom
            const startLeft = Math.random() * 90; // 0 to 90%
            b.style.left = `${startLeft}%`;
            b.style.bottom = `-100px`;
            
            // Randomize colors
            const hues = [330, 340, 350, 310]; // Pink/Purple hues
            const hue = hues[Math.floor(Math.random() * hues.length)];
            b.style.background = `radial-gradient(circle at 30% 30%, hsl(${hue}, 100%, 80%), hsl(${hue}, 80%, 50%))`;
            
            balloonArea.appendChild(b);

            // Animate flying upwards
            const duration = Math.random() * 3000 + 4000; // 4-7 seconds
            const animation = b.animate([
                { transform: 'translateY(0) scale(1)', opacity: 1 },
                { transform: `translateY(-${window.innerHeight + 200}px) scale(1.1)`, opacity: 0.9 }
            ], {
                duration: duration,
                easing: 'linear',
                fill: 'forwards'
            });

            // Cleanup if it reaches top un-popped
            animation.onfinish = () => b.remove();

            // POP LOGIC
            const popHandler = (e) => {
                e.preventDefault();
                b.remove();
                totalPopped++;
                
                // Get absolute coordinates (supports both mouse and touch)
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                createPopEffect(clientX, clientY);
                showFloatingMessage(clientX, clientY);

                // Show next button after 5 pops
                if(totalPopped >= 5) {
                    nextBtnBalloons.style.display = 'inline-block';
                    setTimeout(() => nextBtnBalloons.style.opacity = '1', 50);
                }
            };

            b.addEventListener('mousedown', popHandler);
            b.addEventListener('touchstart', popHandler);
        }

        function createPopEffect(x, y) {
            // Create mini particles
            for(let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                
                // Random explosion trajectory
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 40 + 20;
                p.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                p.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 600); // cleanup
            }
        }

        function showFloatingMessage(x, y) {
            const msgEl = document.createElement('div');
            msgEl.className = 'pop-message';
            msgEl.style.left = `${x}px`;
            msgEl.style.top = `${y}px`;
            
            // Random message
            msgEl.innerText = secretMessages[Math.floor(Math.random() * secretMessages.length)];
            
            document.body.appendChild(msgEl);
            setTimeout(() => msgEl.remove(), 3000); // cleanup after animation
        }

        // --- TASK 6: SECRET EMAIL FORM VIA WEB3FORMS ---
        const form = document.getElementById('secret-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = submitBtn.querySelector('span');
        const loader = document.getElementById('submit-loader');
        const statusText = document.getElementById('form-status');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const accessKey = form.querySelector('[name="access_key"]').value;
            
            if(accessKey === "YOUR_WEB3FORMS_ACCESS_KEY_HERE") {
                statusText.innerText = "Developer Error: Web3Forms API Key is missing!";
                statusText.className = "text-sm font-semibold h-5 mt-1 text-red-400";
                return;
            }

            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);

            statusText.innerText = "";
            btnText.innerText = "Sending...";
            loader.classList.remove('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70');

            try {
                const response = await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: json
                });
                
                const result = await response.json();
                
                if (response.status == 200) {
                    statusText.innerText = "Message sent directly to his heart! ❤️";
                    statusText.className = "text-sm font-semibold h-5 mt-1 text-green-400";
                    form.reset();
                } else {
                    statusText.innerText = "Oops, something went wrong.";
                    statusText.className = "text-sm font-semibold h-5 mt-1 text-red-400";
                }
            } catch (error) {
                statusText.innerText = "Network Error! Please check your connection.";
                statusText.className = "text-sm font-semibold h-5 mt-1 text-red-400";
            } finally {
                btnText.innerText = "Send Message ❤️";
                loader.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70');
            }
        });
    </script>
</body>
</html>
